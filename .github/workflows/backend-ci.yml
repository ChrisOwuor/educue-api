name: Educue Backend CI/CD


on:
  push:

  pull_request:
    branches:
      - main

  workflow_dispatch:


permissions:
  contents: read


jobs:

  # ==========================================================
  # CI
  # ==========================================================

  build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------------
      # Source
      # -------------------------------------------------------

      - name: Checkout source
        uses: actions/checkout@v7


      # -------------------------------------------------------
      # Java
      # -------------------------------------------------------

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven


      # -------------------------------------------------------
      # Maven wrapper
      # -------------------------------------------------------

      - name: Make Maven wrapper executable
        run: chmod +x mvnw


      # -------------------------------------------------------
      # Tests + package
      # -------------------------------------------------------

      - name: Test and build
        run: ./mvnw -B clean verify


      # -------------------------------------------------------
      # Normalize production artifact
      # -------------------------------------------------------

      - name: Prepare deployment artifact
        if: >
          (github.event_name == 'push' &&
           github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' &&
           github.ref == 'refs/heads/main')
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p deployment

          JAR="$(
            find target \
              -maxdepth 1 \
              -type f \
              -name '*.jar' \
              ! -name '*sources.jar' \
              ! -name '*javadoc.jar' \
              | head -n 1
          )"

          if [ -z "$JAR" ]; then
            echo "No deployable JAR found in target/"
            exit 1
          fi

          echo "Deploying artifact:"
          echo "$JAR"

          cp "$JAR" deployment/educue.jar

          sha256sum deployment/educue.jar \
            > deployment/educue.jar.sha256

          ls -lh deployment/


      # -------------------------------------------------------
      # Pass JAR from build job to deploy job
      # -------------------------------------------------------

      - name: Upload deployment artifact
        if: >
          (github.event_name == 'push' &&
           github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' &&
           github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v7
        with:
          name: educue-backend-${{ github.sha }}
          path: deployment/
          retention-days: 7
          if-no-files-found: error



  # ==========================================================
  # PRODUCTION DEPLOYMENT
  # ==========================================================

  deploy-production:
    name: Deploy Production

    needs:
      - build

    if: >
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')

    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://portal.ebadynamics.co.ke

    concurrency:
      group: educue-backend-production
      cancel-in-progress: false


    steps:

      # -------------------------------------------------------
      # Download exact artifact built by CI
      # -------------------------------------------------------

      - name: Download deployment artifact
        uses: actions/download-artifact@v8
        with:
          name: educue-backend-${{ github.sha }}
          path: deployment


      # -------------------------------------------------------
      # Integrity check
      # -------------------------------------------------------

      - name: Verify artifact checksum
        shell: bash
        run: |
          set -Eeuo pipefail

          cd deployment

          sha256sum --check educue.jar.sha256

          test -s educue.jar

          ls -lh educue.jar


      # -------------------------------------------------------
      # Validate production configuration
      # -------------------------------------------------------

      - name: Validate deployment configuration
        env:
          PROD_HOST: ${{ vars.PROD_HOST }}
          PROD_USER: ${{ vars.PROD_USER }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail

          test -n "$PROD_HOST" || {
            echo "PROD_HOST is missing"
            exit 1
          }

          test -n "$PROD_USER" || {
            echo "PROD_USER is missing"
            exit 1
          }

          test -n "$PROD_SSH_PRIVATE_KEY" || {
            echo "PROD_SSH_PRIVATE_KEY is missing"
            exit 1
          }

          test -n "$PROD_SSH_KNOWN_HOSTS" || {
            echo "PROD_SSH_KNOWN_HOSTS is missing"
            exit 1
          }


      # -------------------------------------------------------
      # SSH setup
      # -------------------------------------------------------

      - name: Configure SSH
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail

          install -d -m 700 "$HOME/.ssh"

          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/id_ed25519"

          chmod 600 "$HOME/.ssh/id_ed25519"

          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" \
            > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

          ssh-keygen -y \
            -f "$HOME/.ssh/id_ed25519" \
            > /dev/null


      # -------------------------------------------------------
      # Test connection before touching production
      # -------------------------------------------------------

      - name: Verify production SSH
        env:
          PROD_HOST: ${{ vars.PROD_HOST }}
          PROD_USER: ${{ vars.PROD_USER }}
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$PROD_USER@$PROD_HOST" \
            'echo "Production SSH connection successful."'



      # -------------------------------------------------------
      # Upload JAR
      # -------------------------------------------------------

      - name: Upload application
        env:
          PROD_HOST: ${{ vars.PROD_HOST }}
          PROD_USER: ${{ vars.PROD_USER }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          scp \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            deployment/educue.jar \
            "$PROD_USER@$PROD_HOST:/home/deploy/incoming/$RELEASE_SHA.jar"



      # -------------------------------------------------------
      # Deploy + health check + automatic rollback
      # -------------------------------------------------------

      - name: Deploy release
        env:
          PROD_HOST: ${{ vars.PROD_HOST }}
          PROD_USER: ${{ vars.PROD_USER }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$PROD_USER@$PROD_HOST" \
            "sudo /usr/local/sbin/educue-deploy '$RELEASE_SHA'"



      # -------------------------------------------------------
      # Show deployed commit
      # -------------------------------------------------------

      - name: Deployment summary
        env:
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          echo "=========================================="
          echo "Educue backend deployed successfully"
          echo "=========================================="
          echo
          echo "Commit:"
          echo "$RELEASE_SHA"
          echo
          echo "Production:"
          echo "https://portal.ebadynamics.co.ke"
