spring:
  application:
    name: educue

  datasource:
    url: jdbc:postgresql://localhost:5432/educue
    username: your_database_username
    password: your_database_password

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

server:
  port: 8080

jwt:
  secret: replace_with_a_long_random_base64_secret
  expiration-minutes: 600

app:
  cors:
    allowed-origins: http://localhost:5173

  bootstrap-admin:
    email: admin@example.com
    password: change_this_password
    full-name: System Administrator

  storage:
    local-root: ./storage

logging:
  level:
    web: debug
