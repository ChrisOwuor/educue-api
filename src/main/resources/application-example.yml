spring:
  application:
    name: educue

  datasource:
    url: jdbc:postgresql://localhost:5432/educue
    username: your_database_username
    password: your_database_password

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

server:
  port: 8080

jwt:
  secret: replace_with_a_long_random_base64_secret
  expiration-minutes: 600

app:
  cors:
    allowed-origins: http://localhost:5173

  bootstrap-admin:
    email: admin@example.com
    password: change_this_password
    full-name: System Administrator

  storage:
    local-root: ./storage

  mpesa:
    base-url: https://sandbox.safaricom.co.ke
    consumer-key: replace_with_daraja_consumer_key
    consumer-secret: replace_with_daraja_consumer_secret
    short-code: 600000
    stk-passkey: replace_with_lipa_na_mpesa_passkey
    stk-callback-token: replace_with_a_long_random_stk_callback_token
    callback-token: replace_with_a_long_random_callback_token
    phone-hash-pepper: replace_with_a_separate_long_random_secret
    worker-delay-ms: 500
    recovery-delay-ms: 60000

logging:
  level:
    web: debug
