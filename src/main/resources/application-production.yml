spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/production
    validate-migration-naming: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

app:
  public-base-url: ${PUBLIC_BASE_URL}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL}
    password: ${BOOTSTRAP_ADMIN_PASSWORD}
    full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:System Administrator}
  storage:
    local-root: ${STORAGE_LOCAL_ROOT}
  finance:
    receipt-prefix: ${FINANCE_RECEIPT_PREFIX:MB02}
  mpesa:
    base-url: ${MPESA_BASE_URL:https://api.safaricom.co.ke}
    consumer-key: ${MPESA_CONSUMER_KEY}
    consumer-secret: ${MPESA_CONSUMER_SECRET}
    short-code: ${MPESA_SHORT_CODE}
    stk-passkey: ${MPESA_STK_PASSKEY}
    stk-callback-token: ${MPESA_STK_CALLBACK_TOKEN}
    callback-token: ${MPESA_CALLBACK_TOKEN}
    phone-hash-pepper: ${MPESA_PHONE_HASH_PEPPER}

server:
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      show-details: never
