    c2b-short-code: ${MPESA_C2B_SHORT_CODE:600584}
    stk-short-code: ${MPESA_STK_SHORT_CODE:174379}
    stk-passkey: ${MPESA_STK_PASSKEY:bfb279f9aa9bdbcf158e97dd71a467cd2e0c893059b10f78e6b72ada1ed2c919}
    stk-callback-token: ${MPESA_STK_CALLBACK_TOKEN:c56aa6fe921148f78d2b18646e35650e2acd0c1d6f0945b0981b2e3b4bb682ce}
